<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- 拓扑连接曲线 (贝塞尔连接线) -->
  <!-- 节点1 -> 节点2 -->
  <path d="M 36 64 C 48 64, 48 38, 64 38" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2" opacity="0.8" />
  <!-- 节点1 -> 节点3 -->
  <path d="M 36 64 C 48 64, 48 90, 64 90" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <!-- 节点2 -> 节点4 -->
  <path d="M 64 38 C 80 38, 80 64, 92 64" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <!-- 节点3 -> 节点4 -->
  <path d="M 64 90 C 80 90, 80 64, 92 64" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2" opacity="0.8" />

  <!-- 节点1 (Root / Input) -->
  <circle cx="36" cy="64" r="10" fill="#252733" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="36" cy="64" r="4" fill="#ffffff" />

  <!-- 节点2 (Stage 1 Branch A) -->
  <circle cx="64" cy="38" r="9" fill="#252733" stroke="url(#accentGrad)" stroke-width="2.5" />
  <circle cx="64" cy="38" r="3.5" fill="#00f2fe" />

  <!-- 节点3 (Stage 1 Branch B) -->
  <circle cx="64" cy="90" r="9" fill="#252733" stroke="url(#primaryGrad)" stroke-width="2.5" />
  <circle cx="64" cy="90" r="3.5" fill="#ff7eb3" />

  <!-- 节点4 (Convergence / Output) -->
  <circle cx="92" cy="64" r="11" fill="#252733" stroke="url(#nodeGrad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="92" cy="64" r="4.5" fill="#ffffff" />
</svg>
