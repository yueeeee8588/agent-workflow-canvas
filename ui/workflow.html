<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作流调度画布</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fbf9f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #3d3b38;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #4a6b5d;
      animation: spin 0.8s ease-in-out infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loader">
    <div class="spinner"></div>
    <div style="font-size: 13px; letter-spacing: 0.5px;">正在加载水墨工作流方案...</div>
  </div>
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || 'latest';
        var search = window.location.search ? window.location.search : '';
        // 拼接宿主 v2 App 后端动态渲染路由
        var targetUrl = '/api/apps/agent-workflow-canvas/routes/workflow/' + encodeURIComponent(id) + search;
        window.location.replace(targetUrl);
      } catch (e) {
        document.getElementById('loader').innerHTML = '<div style="color:#a83a32;font-size:13px;">加载失败: ' + (e.message || e) + '</div>';
      }
    })();
  </script>
</body>
</html>
